<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Internship and Placement Portal</title>
<style>
  :root { --ink:#111; --accent:#0b3d91; --line:#767676; --ok:#0a5c2e; --err:#a40000; }
  * { box-sizing: border-box; }
  body { font-family: Arial, Helvetica, sans-serif; font-size: 1.05rem; line-height: 1.5; color: var(--ink); background: #fff; margin: 0; }
  header, main { max-width: 60rem; margin: 0 auto; padding: 1rem; }
  header { border-bottom: 2px solid var(--ink); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: .5rem; }
  h1 { font-size: 1.6rem; margin: 0; }
  h2 { font-size: 1.3rem; margin-top: 2rem; }
  .skip { position: absolute; left: -999px; top: 0; background: #fff; padding: .5rem 1rem; border: 2px solid var(--ink); }
  .skip:focus { left: 1rem; top: 1rem; z-index: 10; }
  label { display: block; font-weight: bold; margin-top: .75rem; }
  input { width: 100%; max-width: 26rem; padding: .5rem; font-size: 1rem; border: 2px solid var(--line); border-radius: 4px; }
  button { padding: .55rem 1rem; font-size: 1rem; background: var(--accent); color: #fff; border: 2px solid var(--accent); border-radius: 4px; cursor: pointer; margin-top: 1rem; }
  button.secondary { background: #fff; color: var(--accent); margin-top: 0; }
  :focus-visible { outline: 3px solid #b35900; outline-offset: 2px; }
  table { border-collapse: collapse; width: 100%; margin-top: .5rem; }
  caption { text-align: left; font-weight: bold; padding: .25rem 0; }
  th, td { border: 1px solid var(--line); padding: .5rem; text-align: left; }
  th { background: #eee; }
  .table-wrap { overflow-x: auto; }
  #status { min-height: 2.75rem; padding: .5rem; margin: 1rem 0; border: 2px solid var(--line); font-weight: bold; }
  #status.ok { border-color: var(--ok); color: var(--ok); }
  #status.err { border-color: var(--err); color: var(--err); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<a class="skip" href="#main">Skip to main content</a>
<header>
  <h1>Internship &amp; Placement Portal</h1>
  <div id="session" hidden>
    <span id="who"></span>
    <button type="button" id="logout" class="secondary">Sign out</button>
  </div>
</header>

<main id="main">
  <div id="status" role="status" aria-live="polite"></div>

  <section id="login-section" aria-labelledby="login-h">
    <h2 id="login-h">Sign in</h2>
    <form id="login-form">
      <label for="email">College email</label>
      <input id="email" type="email" autocomplete="username" required>
      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password" required>
      <button type="submit">Sign in</button>
    </form>
  </section>

  <div id="student" hidden>
    <section aria-labelledby="profile-h">
      <h2 id="profile-h" tabindex="-1">My profile</h2>
      <form id="profile-form">
        <label for="branch">Branch (for example CSE)</label>
        <input id="branch" type="text" required>
        <label for="cgpa">CGPA (0 to 10)</label>
        <input id="cgpa" type="number" min="0" max="10" step="0.01" required>
        <label for="backlogs">Number of backlogs</label>
        <input id="backlogs" type="number" min="0" step="1" required>
        <label for="skills">Skills (separate with commas)</label>
        <input id="skills" type="text">
        <label for="contact">Contact number</label>
        <input id="contact" type="tel">
        <button type="submit">Save profile</button>
      </form>
    </section>

    <section aria-labelledby="drives-h">
      <h2 id="drives-h">Drives I am eligible for</h2>
      <button type="button" id="refresh-drives" class="secondary">Refresh list</button>
      <div class="table-wrap">
        <table>
          <caption>Eligible drives</caption>
          <thead><tr><th scope="col">Company</th><th scope="col">Role</th><th scope="col">Package</th><th scope="col">Deadline</th><th scope="col">Action</th></tr></thead>
          <tbody id="drives-body"></tbody>
        </table>
      </div>
    </section>

    <section aria-labelledby="apps-h">
      <h2 id="apps-h">My applications</h2>
      <div class="table-wrap">
        <table>
          <caption>My applications</caption>
          <thead><tr><th scope="col">Company</th><th scope="col">Role</th><th scope="col">Status</th><th scope="col">Applied on</th></tr></thead>
          <tbody id="apps-body"></tbody>
        </table>
      </div>
    </section>
  </div>

  <div id="tpo" hidden>
    <section aria-labelledby="post-h">
      <h2 id="post-h" tabindex="-1">Post a drive</h2>
      <form id="drive-form">
        <label for="d-company">Company</label>
        <input id="d-company" type="text" required>
        <label for="d-role">Role</label>
        <input id="d-role" type="text" required>
        <label for="d-package">Package or stipend</label>
        <input id="d-package" type="text" required>
        <label for="d-cgpa">Minimum CGPA</label>
        <input id="d-cgpa" type="number" min="0" max="10" step="0.01" required>
        <label for="d-branches">Allowed branches (separate with commas)</label>
        <input id="d-branches" type="text" required>
        <label for="d-backlogs">Maximum backlogs</label>
        <input id="d-backlogs" type="number" min="0" step="1" required>
        <label for="d-deadline">Application deadline</label>
        <input id="d-deadline" type="date" required>
        <button type="submit">Post drive</button>
      </form>
    </section>
    <section aria-labelledby="all-h">
      <h2 id="all-h">All posted drives</h2>
      <div class="table-wrap">
        <table>
          <caption>All posted drives</caption>
          <thead><tr><th scope="col">ID</th><th scope="col">Company</th><th scope="col">Role</th><th scope="col">Package</th><th scope="col">Deadline</th></tr></thead>
          <tbody id="all-drives-body"></tbody>
        </table>
      </div>
    </section>
  </div>
</main>

<script>
let token = null;
const $ = (id) => document.getElementById(id);

function say(msg, kind) {
  const s = $('status');
  s.textContent = msg;
  s.className = kind || '';
}

function addCell(tr, text) {
  const td = document.createElement('td');
  td.textContent = text == null ? '' : String(text);
  tr.appendChild(td);
}

function messageRow(body, cols, text) {
  body.textContent = '';
  const tr = document.createElement('tr');
  const td = document.createElement('td');
  td.colSpan = cols;
  td.textContent = text;
  tr.appendChild(td);
  body.appendChild(tr);
}

async function api(method, path, body) {
  const headers = { 'Content-Type': 'application/json' };
  if (token) headers.Authorization = 'Bearer ' + token;
  const res = await fetch('/api' + path, { method, headers, body: body ? JSON.stringify(body) : undefined });
  let data = null;
  try { data = await res.json(); } catch (e) {}
  if (!res.ok) {
    const err = new Error((data && data.message) || ('Request failed (' + res.status + ')'));
    err.status = res.status;
    throw err;
  }
  return data;
}

function claims(t) {
  try {
    return JSON.parse(atob(t.split('.')[1].replace(/-/g, '+').replace(/_/g, '/')));
  } catch (e) { return {}; }
}

async function loadProfile() {
  try {
    const p = await api('GET', '/profile');
    $('branch').value = p.branch;
    $('cgpa').value = p.cgpa;
    $('backlogs').value = p.backlogs;
    $('skills').value = (p.skills || []).join(', ');
    $('contact').value = p.contact || '';
  } catch (err) {
    if (err.status !== 404) say(err.message, 'err');
  }
}

async function loadDrives() {
  const body = $('drives-body');
  try {
    const drives = await api('GET', '/drives/eligible');
    if (drives.length === 0) { messageRow(body, 5, 'No eligible drives right now.'); return; }
    body.textContent = '';
    drives.forEach((d) => {
      const tr = document.createElement('tr');
      addCell(tr, d.company); addCell(tr, d.role); addCell(tr, d.package); addCell(tr, d.deadline);
      const td = document.createElement('td');
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.textContent = 'Apply';
      btn.style.marginTop = '0';
      btn.setAttribute('aria-label', 'Apply to ' + d.role + ' at ' + d.company);
      btn.addEventListener('click', () => apply(d));
      td.appendChild(btn);
      tr.appendChild(td);
      body.appendChild(tr);
    });
  } catch (err) {
    messageRow(body, 5, err.status === 404 ? 'Save your profile to see eligible drives.' : err.message);
  }
}

async function apply(d) {
  try {
    await api('POST', '/drives/' + d.id + '/apply');
    say('Applied to ' + d.role + ' at ' + d.company + '.', 'ok');
    await loadApps();
  } catch (err) {
    say(err.message, 'err');
  }
}

async function loadApps() {
  const body = $('apps-body');
  try {
    const apps = await api('GET', '/applications');
    if (apps.length === 0) { messageRow(body, 4, 'You have not applied to any drive yet.'); return; }
    body.textContent = '';
    apps.forEach((a) => {
      const tr = document.createElement('tr');
      addCell(tr, a.company); addCell(tr, a.role); addCell(tr, a.status);
      addCell(tr, new Date(a.appliedAt).toLocaleString());
      body.appendChild(tr);
    });
  } catch (err) { messageRow(body, 4, err.message); }
}

async function loadAllDrives() {
  const body = $('all-drives-body');
  try {
    const drives = await api('GET', '/drives');
    if (drives.length === 0) { messageRow(body, 5, 'No drives posted yet.'); return; }
    body.textContent = '';
    drives.forEach((d) => {
      const tr = document.createElement('tr');
      addCell(tr, d.id); addCell(tr, d.company); addCell(tr, d.role); addCell(tr, d.package); addCell(tr, d.deadline);
      body.appendChild(tr);
    });
  } catch (err) { messageRow(body, 5, err.message); }
}

$('login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = $('email').value.trim();
  try {
    const r = await api('POST', '/auth/login', { email, password: $('password').value });
    token = r.token;
    const role = claims(token).role;
    $('password').value = '';
    $('login-section').hidden = true;
    $('session').hidden = false;
    $('who').textContent = 'Signed in as ' + email + ' (' + role + ')';
    say('Signed in successfully.', 'ok');
    if (role === 'TPO') {
      $('tpo').hidden = false;
      $('post-h').focus();
      await loadAllDrives();
    } else {
      $('student').hidden = false;
      $('profile-h').focus();
      await loadProfile();
      await loadDrives();
      await loadApps();
    }
  } catch (err) {
    say('Sign in failed: ' + err.message, 'err');
  }
});

$('logout').addEventListener('click', () => {
  token = null;
  $('session').hidden = true;
  $('student').hidden = true;
  $('tpo').hidden = true;
  $('login-section').hidden = false;
  say('You have signed out.', 'ok');
  $('email').focus();
});

$('profile-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  try {
    await api('PUT', '/profile', {
      branch: $('branch').value.trim(),
      cgpa: Number($('cgpa').value),
      backlogs: Number($('backlogs').value),
      skills: $('skills').value.split(',').map((s) => s.trim()).filter(Boolean),
      contact: $('contact').value.trim(),
    });
    say('Profile saved.', 'ok');
    await loadDrives();
  } catch (err) { say(err.message, 'err'); }
});

$('refresh-drives').addEventListener('click', async () => {
  await loadDrives();
  say('Drive list refreshed.', 'ok');
});

$('drive-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  try {
    await api('POST', '/drives', {
      company: $('d-company').value.trim(),
      role: $('d-role').value.trim(),
      package: $('d-package').value.trim(),
      eligibility: {
        minCgpa: Number($('d-cgpa').value),
        branches: $('d-branches').value.split(',').map((s) => s.trim()).filter(Boolean),
        maxBacklogs: Number($('d-backlogs').value),
      },
      deadline: $('d-deadline').value,
    });
    say('Drive posted.', 'ok');
    e.target.reset();
    await loadAllDrives();
  } catch (err) { say(err.message, 'err'); }
});
</script>
</body>
</html>
